# GUSTO · manutenção semanal automática
# Domingo 04:17 (Brasília): reconstrói homologação com as imagens base mais recentes (Node, PostGIS) e,
# só se ela passar na checagem de saúde, faz o mesmo em produção. O código não muda — só patches das imagens.
name: manutencao

on:
  schedule:
    - cron: "17 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: teste
    secrets: inherit

  producao:
    needs: teste
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: producao
    secrets: inherit

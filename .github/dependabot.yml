# GUSTO · atualizações automáticas de dependências
# Os PRs abrem contra "teste": passam pelos testes, publicam em /teste/ ao serem aceitos e só então vão para produção.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: teste
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    groups:
      correcoes:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /app
    target-branch: teste
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
  - package-ecosystem: github-actions
    directory: /
    target-branch: teste
    schedule: { interval: monthly }
